name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump override (leave empty for auto-detect from commits)"
        required: false
        type: choice
        options:
          - ""
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write
  pages: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [ci]
    env:
      BUMP_OVERRIDE: ${{ inputs.bump }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Determine version bump
        id: bump
        run: |
          if [ -n "$BUMP_OVERRIDE" ]; then
            echo "type=$BUMP_OVERRIDE" >> "$GITHUB_OUTPUT"
          else
            BUMP=$(node scripts/detect-version-bump.js)
            echo "type=$BUMP" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version
        if: steps.bump.outputs.type != 'none'
        id: version
        run: |
          npm version "${{ steps.bump.outputs.type }}" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.bump.outputs.type != 'none'
        run: pnpm build

      - name: Pack
        if: steps.bump.outputs.type != 'none'
        run: npm pack

      - name: Commit version bump
        if: steps.bump.outputs.type != 'none'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Guard against re-tagging an already-published version. If the
          # tag exists on origin a prior run already released it; bumping
          # again would only collide, so fail loudly with a clear cause.
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists on origin — version is already released. Bump package.json on master past it and re-run."
            exit 1
          fi
          git add package.json pnpm-lock.yaml
          git commit -m "[INTERNAL] Release v${VERSION}"
          git tag "v${VERSION}"
          # Atomic push: master and the tag land together or not at all.
          # Prevents the orphaned-tag failure mode where the tag pushed
          # but the bump commit was rejected (non-fast-forward), leaving
          # master stuck a version behind and every later run colliding.
          git push --atomic origin master "refs/tags/v${VERSION}"

      - name: Create GitHub Release
        if: steps.bump.outputs.type != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES=$(node scripts/release-notes.js)
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes "$NOTES" \
            night-orch-*.tgz

      - name: Publish to npm
        if: steps.bump.outputs.type != 'none'
        run: |
          # Provenance uploads an attestation to the sigstore Rekor
          # transparency log (rekor.sigstore.dev). That service is
          # intermittently unavailable and returns TLOG_CREATE_ENTRY_ERROR,
          # which hard-fails the whole publish. Retry a few times, then fall
          # back to a plain publish so a sigstore outage can never block a
          # release. A plain publish loses the attestation but ships the package.
          for attempt in 1 2 3; do
            if npm publish --provenance; then
              echo "Published with provenance (attempt ${attempt})."
              exit 0
            fi
            echo "::warning::Provenance publish failed (attempt ${attempt}/3). Retrying in 15s..."
            sleep 15
          done
          echo "::warning::Provenance unavailable after 3 attempts — publishing without provenance."
          npm publish

      - name: Skip — no releasable changes
        if: steps.bump.outputs.type == 'none'
        run: echo "No releasable commits since last tag. Skipping release."

  docs:
    name: Docs
    needs: [release]
    uses: ./.github/workflows/docs.yml
