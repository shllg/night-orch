repos:
  - repo: myorg/myrepo
    forge: github
    # linkedProjects:
    #   - myorg/tracker
    localPath: ~/code/myrepo
    maxConcurrentRuns: 1
    baseBranch: main
    branchPrefix: orch
    # updateStrategy: merge  # 'merge' (default, reliable) or 'rebase' (linear history)
    labels:
      ready:
        - no:ready
      running: no:running
      blocked:
        - no:blocked
        - no:needs-human
      reviewReady: no:review-ready
      error: no:error
      retry: no:retry
      planning: no:planning
      # mergeQueued: no:merge-queued
      # merging: no:merging
      # mergeFailed: no:merge-failed
      # rebasing: no:rebasing
    # Optional kanban-state flow. If triggerLabel is present on an issue,
    # these labels are used for state transitions instead of labels above.
    # kanban:
    #   triggerLabel: flow:kanban
    #   labels:
    #     ready: [kanban:todo]
    #     running: kanban:doing
    #     blocked: kanban:blocked
    #     needsHuman: kanban:needs-human
    #     reviewReady: kanban:review
    #     error: kanban:error
    #     retry: kanban:retry
    #     planning: kanban:planning
    #     mergeQueued: kanban:merge-queued
    #     merging: kanban:merging
    #     mergeFailed: kanban:merge-failed
    #     rebasing: kanban:rebasing
    planning:
      prdDirectory: docs/prd
    # Optional repo-specific file-loop overrides. Values merge over the
    # top-level fileLoop defaults.
    # fileLoop:
    #   enabled: true
    #   maxDurationMinutes: 240
    #   reviewerProfileKey: codex-default
    # Optional per-label metadata overrides used by `night-orch labels-init`
    labelConfig:
      no:ready:
        color: 0E8A16
        description: Queued for night-orch processing
      no:running:
        color: FBCA04
        description: Currently being processed by night-orch
      no:planning:
        color: C2E0C6
        description: Planning-only mode (PRD markdown only)
    defaults:
      planner: claude
      coder: codex
      reviewer: codex
    # verificationProfile: strict
      doneMode: pr-ready
      notifyPriority: normal
      prMentions:
        - claude
    environment:
      defaultMode: shared
      # dedicated:
      #   compose:
      #     file: docker-compose.dev.yml
      #     services: [db, redis]
      #     projectName: "orch-{issue}"
      #   env:
      #     copyFrom: .env
      #     overrides:
      #       PORT: "{auto:5101-5199}"
      #       DATABASE_URL: "postgres://localhost:5432/myapp_orch_{issue}"
      #   healthcheck: "curl -f http://localhost:{port}/health"
      #   teardownOnComplete: true
      shared:
        requireRunning: true
        healthcheck: "curl -f http://localhost:3000/health"
      bootstrap:
        - command: pnpm install --frozen-lockfile
          when: always
        # - command: bundle exec rails db:prepare
        #   when: always
        #   failureHints:
        #     - contains: 'role "app_user" does not exist'
        #       message: 'Create PostgreSQL role "app_user" locally before rerunning bootstrap.'
        #       output: combined
    verify:
      - pnpm lint
      - pnpm typecheck
      - pnpm test
    # Optional: preflight drift gate. Verify the base branch is green
    # before dispatching fresh work; if base is already red, skip the
    # whole batch this cycle instead of failing every issue in series.
    # preflight:
    #   enabled: true
    #   commands: [pnpm typecheck]   # cheap smoke check against base HEAD
    prompts:
      plannerSystem: .night-orch/prompts/planner-system.md
      coderSystem: .night-orch/prompts/coder-system.md
      reviewerSystem: .night-orch/prompts/reviewer-system.md
      # Prompt files execute inside the issue worktree. Example prompt body:
      #   $tdd
      #   Use the repo-local .claude/skills/tdd skill for behavior changes.
    selectors:
      includeLabelsAny:
        - no:ready
      excludeLabelsAny:
        - no:blocked
        - no:error
    agents:
      claude: claude-default
      codex: codex-default
      # opencode: opencode-qwen
    # workflow: minimal           # Reference a named workflow
    # workflowByTriage:
    #   trivial: fast-trivial
    #   standard: minimal
    # autoRebaseOnMerge:
    #   enabled: false
    #   maxFanout: 10
    #   strategy: rebase
    #   # maxChainLength: 6
    # mergeQueue:
    #   enabled: true
    #   batchSize: 5
    #   mergeMethod: merge
    #   retryFlakyOnce: true
    #   requireApproval: true
    #   stagingBranchPrefix: orch/staging
