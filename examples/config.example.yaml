version: 1

github:
  tokenEnv: GITHUB_TOKEN
  apiBaseUrl: https://api.github.com
  pollIntervalSeconds: 300
  appMentions:
    claude:
      enabled: true
      commentTemplate: "@claude Please review this PR and apply fixes if needed."
    codex:
      enabled: false
      commentTemplate: "@codex please review and patch any remaining issues."

storage:
  dbPath: ~/.config/night-orch/state.db
  worktreeRoot: ~/code/.night-orch/worktrees
  logsRoot: ~/code/.night-orch/logs
  autoCleanup:
    enabled: true
    intervalMinutes: 60
  retention:
    worktreeAgeDays: 7
    detailDays: 30
    archiveDays: 90

notifications:
  channels:
    - type: console
    # - type: webhook
    #   urlEnv: NIGHT_ORCH_WEBHOOK_URL
    # - type: discord
    #   urlEnv: NIGHT_ORCH_DISCORD_WEBHOOK_URL
  events:
    onRunStarted: false
    onBlocked: true
    onPrReady: true
    onPrUpdated: true
    onError: true
    onRetryExhausted: true

loop:
  maxReviewIterations: 4
  maxTotalAgentPasses: 10
  maxAttemptChainLength: 3         # Hard cap on follow-up attempts per issue
  maxRunTokens: 0                  # 0 disables per-attempt token budget
  maxIssueTokens: 0                # 0 disables per-issue token budget
  maxDailyTokens: 0                # 0 disables UTC-day token budget
  maxRunWallClockMinutes: 0        # 0 disables per-run wall-clock budget
  stopOnPlannerFailure: true
  requireVerificationPass: true
  reviewApprovalKeyword: APPROVED
  reviewNeedsChangesKeyword: CHANGES_REQUIRED
  blockOnAmbiguousReview: true
  maxAutoRetries: 3
  # decompose: true              # Enable issue decomposition into sub-tasks
  # maxSubtasks: 5               # Max sub-tasks per decomposition
  # maxConcurrentSubtasks: 3     # Max parallel sub-task worktrees

fileLoop:
  enabled: false
  maxDurationMinutes: 480
  maxIterations: 1000
  minIntervalSecondsBetweenFiles: 5
  perIterationTimeoutSeconds: 120
  maxCostUsd: 5
  maxFileLines: 1500
  reviewerProfileKey: claude-default
  branchNameTemplate: orch/file-loop/{repoSlug}/{yyyyMmDd}
  loopMdPath: loop.md
  commitPrefix: "[FILE-LOOP]"
  perEditVerify:
    enabled: true
    commands:
      - pnpm typecheck
    timeoutSeconds: 60
  finalizeVerify:
    enabled: true
    commands:
      - pnpm typecheck
      - pnpm lint
    timeoutSeconds: 300
    onFailure: draft-pr

security:
  maxChangedFiles: 50
  maxChangedLines: 5000
  maxDailyCostUsd: 50
  maxCostPerRunUsd: 10

cost:
  model: pay-per-use # or: subscription, subscription-metered
  # Optional: controls for subscription-metered mode.
  # subscriptionMetered:
  #   advisoryThresholdUsd: null
  #   enforcePerRunLimit: false
  #   enforceDailyLimit: false
  # Optional: subscription quota tracking. Compares cumulative *theoretical*
  # (tokens x list-price) spend for the period against the included
  # allowance; once exhausted, billing swaps to usage-based. Only applies
  # when model is subscription / subscription-metered.
  # subscriptionQuota:
  #   includedUsd: 200       # included allowance in theoretical USD
  #   period: month          # day | month
  #   onExhausted: warn      # warn | enforce (enforce applies maxDailyCostUsd to the overage)
  # Optional: model-aware pricing overrides.
  # If omitted, built-in defaults are used for advisory/estimated USD.
  # pricing:
  #   defaultModel: claude-sonnet-4
  #   models:
  #     claude-sonnet-4:
  #       inputUsdPerMillionTokens: 3
  #       outputUsdPerMillionTokens: 15
  #       cacheReadUsdPerMillionTokens: 0.3
  #       minuteUsd: 0.008
  #     gpt-5:
  #       inputUsdPerMillionTokens: 1.25
  #       outputUsdPerMillionTokens: 10
  #       cacheReadUsdPerMillionTokens: 0.125
  #       minuteUsd: 0.01

# Optional direct-LLM features used by night-orch itself.
# Leave provider/model/apiKeyEnv unset to keep the internal AI layer disabled.
# ai:
#   internal:
#     provider: anthropic
#     model: claude-3-5-sonnet-20241022
#     apiKeyEnv: ANTHROPIC_API_KEY
#     features:
#       conflictResolver: true
#     enable:
#       triage: false
#       reviewerParseFallback: false
#       prBody: false

# Optional bounded AI-assisted resolver for queued rebase conflicts.
# If disabled or unavailable, rebase conflicts still fall back to the
# normal merge_conflict block path.
# autoResolveConflicts:
#   enabled: true
#   maxAttempts: 2
#   maxFiles: 5

workerProfiles:
  claude-default:
    type: claude
    # pricingModel: claude-sonnet-4
    # minuteUsd: 0.008
    command: claude
    args:
      - -p
    workerTimeoutSeconds: 1800
    sandbox:
      type: host
    env: {}
  codex-default:
    type: codex
    # pricingModel: gpt-5
    # minuteUsd: 0.01
    command: codex
    args:
      - exec
      - --json
    workerTimeoutSeconds: 1800
    # Set sandbox.type to docker or podman to run the worker in a container.
    # Auth/config directories must be mounted explicitly; forge/API tokens are
    # still filtered out by the worker env whitelist.
    sandbox:
      type: host
      # image: night-orch-agent:latest
      # containerUid: 1000
      # containerGid: 1000
      # mounts:
      #   - hostPath: ~/.codex
      #     sandboxPath: /home/agent/.codex
      #     readonly: false
      # env:
      #   CODEX_HOME: /home/agent/.codex
      # network: night-orch-test
    env: {}
  # gemini-acp:
  #   type: acp
  #   command: gemini            # acpx agent name
  #   args: []
  #   workerTimeoutSeconds: 1800
  # opencode-qwen:
  #   type: acp
  #   command: opencode
  #   workerTimeoutSeconds: 1800
  #   env:
  #     OPENCODE_CONFIG_CONTENT: '{"model":"openrouter/qwen/qwen3-coder"}'
  # opencode-kimi:
  #   type: acp
  #   command: opencode
  #   workerTimeoutSeconds: 1800
  #   env:
  #     OPENCODE_CONFIG_CONTENT: '{"model":"openrouter/moonshotai/kimi-k2.5"}'

metrics:
  enabled: true
  port: 9090
  host: 0.0.0.0

observability:
  agentStreaming: true
  eventRetention: 1000
  sessionLogs: true
  sessionLogRetention: 7

commentCommands:
  enabled: true
  requireCollaborator: false

