#       - { type: verify, id: verify }
#       - { type: worker, id: review, role: reviewer }
#       - { type: decide, id: decide, onIterate: code }
#   with-security-review:
#     steps:
#       - { type: worker, id: plan, role: planner, skipWhen: trivial }
#       - { type: worker, id: code, role: coder, continueFrom: plan }
#       - { type: verify, id: verify }
#       - { type: worker, id: security, role: reviewer }
#       - { type: worker, id: review, role: reviewer }
#       - { type: decide, id: decide, onIterate: code }

repos:
  - repo: myorg/myrepo
    forge: github
    # linkedProjects:
    #   - myorg/tracker
    localPath: ~/code/myrepo
    maxConcurrentRuns: 1
    baseBranch: main
    branchPrefix: orch
    labels:
      ready:
        - orch:ready
      running: orch:running
      blocked:
        - orch:blocked
        - orch:needs-human
      reviewReady: orch:review-ready
      error: orch:error
      retry: orch:retry
      planning: orch:planning
      # mergeQueued: orch:merge-queued
      # merging: orch:merging
      # mergeFailed: orch:merge-failed
    # Optional kanban-state flow. If triggerLabel is present on an issue,
    # these labels are used for state transitions instead of labels above.
    # kanban:
    #   triggerLabel: flow:kanban
    #   labels:
    #     ready: [kanban:todo]
    #     running: kanban:doing
    #     blocked: kanban:blocked
    #     needsHuman: kanban:needs-human
    #     reviewReady: kanban:review
    #     error: kanban:error
    #     retry: kanban:retry
    #     planning: kanban:planning
    #     mergeQueued: kanban:merge-queued
    #     merging: kanban:merging
    #     mergeFailed: kanban:merge-failed
    planning:
      prdDirectory: docs/prd
    # Optional per-label metadata overrides used by `night-orch labels-init`
    labelConfig:
      orch:ready:
        color: 0E8A16
        description: Queued for night-orch processing
      orch:running:
        color: FBCA04
        description: Currently being processed by night-orch
      orch:planning:
        color: C2E0C6
        description: Planning-only mode (PRD markdown only)
    defaults:
      planner: claude
      coder: codex
      reviewer: claude
      doneMode: pr-ready
      notifyPriority: normal
      prMentions:
        - claude
    environment:
      defaultMode: shared
      # dedicated:
      #   compose:
      #     file: docker-compose.dev.yml
      #     services: [db, redis]
      #     projectName: "orch-{issue}"
      #   env:
      #     copyFrom: .env
      #     overrides:
      #       PORT: "{auto:5101-5199}"
      #       DATABASE_URL: "postgres://localhost:5432/myapp_orch_{issue}"
      #   healthcheck: "curl -f http://localhost:{port}/health"
      #   teardownOnComplete: true
      shared:
        requireRunning: true
        healthcheck: "curl -f http://localhost:3000/health"
      bootstrap:
        - command: pnpm install --frozen-lockfile
          when: always
    verify:
      - pnpm lint
      - pnpm typecheck
      - pnpm test
    prompts:
      plannerSystem: .night-orch/prompts/planner-system.md
      coderSystem: .night-orch/prompts/coder-system.md
      reviewerSystem: .night-orch/prompts/reviewer-system.md
    selectors:
      includeLabelsAny:
        - orch:ready
      excludeLabelsAny:
        - orch:blocked
        - orch:error
    agents:
      claude: claude-default
      codex: codex-default
    # workflow: minimal           # Reference a named workflow
    # mergeQueue:
    #   enabled: true
    #   batchSize: 5
    #   mergeMethod: merge
    #   retryFlakyOnce: true
    #   requireApproval: true
    #   stagingBranchPrefix: orch/staging
