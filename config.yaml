version: 1

github:
  tokenEnv: GITHUB_TOKEN
  apiBaseUrl: https://api.github.com
  pollIntervalSeconds: 300
  appMentions:
    claude:
      enabled: true
      commentTemplate: "@claude Please review this PR and apply fixes if needed."
    codex:
      enabled: false
      commentTemplate: "@codex please review and patch any remaining issues."

storage:
  dbPath: ~/.night-orch/state.db
  worktreeRoot: ~/.night-orch/worktrees
  logsRoot: ~/.night-orch/logs
  autoCleanup:
    enabled: true
    intervalMinutes: 120
  retention:
    worktreeAgeDays: 7
    detailDays: 30
    archiveDays: 90

notifications:
  channels:
    - type: console
  events:
    onRunStarted: true
    onBlocked: true
    onPrReady: true
    onError: true
    onRetryExhausted: true

loop:
  maxReviewIterations: 3
  maxTotalAgentPasses: 8
  stopOnPlannerFailure: true
  requireVerificationPass: true
  blockOnAmbiguousReview: true
  decompose: true
  maxSubtasks: 5
  maxConcurrentSubtasks: 3

security:
  maxChangedFiles: 50
  maxChangedLines: 5000
  maxDailyCostUsd: 25
  maxCostPerRunUsd: 8

workerProfiles:
  claude:
    type: claude
    command: claude
    args:
      - -p
    workerTimeoutSeconds: 1800
    minimalEnv: true
    env: {}
  codex:
    type: codex
    command: codex
    args:
      - exec
      - --json
    workerTimeoutSeconds: 1800
    minimalEnv: true
    env: {}
  # gemini-acp:
  #   type: acp
  #   command: gemini            # acpx agent name
  #   args: []
  #   workerTimeoutSeconds: 1800

metrics:
  enabled: true
  port: 9100
  host: 0.0.0.0

commentCommands:
  enabled: true
  requireCollaborator: false

mcp:
  enabled: true
  httpPort: 3100

workflows:
  dailywerk-hardened:
    steps:
      - type: worker
        id: plan
        role: planner
        skipWhen: trivial
      - type: worker
        id: code
        role: coder
        continueFrom: plan
      - type: verify
        id: verify
      - type: worker
        id: security
        role: reviewer
        prompt: /home/sascha/src/tools/ai-project-runner/.night-orch/prompts/dailywerk-security-review.md
      - type: worker
        id: performance
        role: reviewer
        continueFrom: security
        prompt: /home/sascha/src/tools/ai-project-runner/.night-orch/prompts/dailywerk-performance-review.md
      - type: worker
        id: review
        role: reviewer
        continueFrom: performance
      - type: decide
        id: decide
        onIterate: code

repos:
  - repo: shllg/night-orch
    forge: github
    localPath: ~/src/tools/ai-project-runner
    maxConcurrentRuns: 2
    baseBranch: master
    branchPrefix: orch
    labels:
      ready:
        - orch:ready
      running: orch:running
      blocked:
        - orch:blocked
        - orch:needs-human
      reviewReady: orch:review-ready
      error: orch:error
      retry: orch:retry
      planning: orch:planning
    planning:
      prdDirectory: docs/prd
    defaults:
      planner: claude
      coder: codex
      reviewer: codex
      doneMode: pr-ready
    selectors:
      includeLabelsAny:
        - orch:ready
      excludeLabelsAny:
        - orch:blocked
        - orch:error
        - orch:needs-human
    environment:
      defaultMode: shared
      bootstrap:
        - command: pnpm install --frozen-lockfile
          when: always
    verify:
      - pnpm typecheck
      - pnpm lint
      - pnpm test
    agents:
      claude: claude
      codex: codex
  - repo: shllg/dailywerk
    forge: github
    localPath: ~/src/dailywerk/dailywerk
    maxConcurrentRuns: 2
    baseBranch: master
    branchPrefix: orch
    labels:
      ready:
        - orch:ready
      running: orch:running
      blocked: orch:blocked
      needsHuman: orch:needs-human
      reviewReady: orch:review-ready
      error: orch:error
      retry: orch:retry
      planning: orch:planning
    planning:
      prdDirectory: docs/prd
    defaults:
      planner: claude
      coder: codex
      reviewer: codex
      doneMode: pr-ready
    selectors:
      includeLabelsAny:
        - orch:ready
      excludeLabelsAny:
        - orch:blocked
        - orch:error
        - orch:needs-human
    environment:
      defaultMode: shared
      bootstrap:
        - command:
            - docker
            - compose
            - -p
            - dailywerk
            - up
            - -d
            - --wait
          when: shared
        - command:
            - docker
            - compose
            - -p
            - dailywerk
            - --profile
            - setup
            - run
            - --rm
            - rustfs-setup
          when: shared
        - command:
            - bundle
            - install
        - command:
            - pnpm
            - -C
            - frontend
            - install
            - --frozen-lockfile
        - command:
            - bundle
            - exec
            - rails
            - db:prepare
    verify:
      - - bundle
        - exec
        - rails
        - test
      - - bundle
        - exec
        - rubocop
      - - bundle
        - exec
        - brakeman
        - --quiet
      - - pnpm
        - -C
        - frontend
        - lint
      - - pnpm
        - -C
        - frontend
        - test
      - - pnpm
        - -C
        - frontend
        - build
    workflow: dailywerk-hardened
    agents:
      claude: claude
      codex: codex
