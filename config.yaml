version: 1

github:
  tokenEnv: GITHUB_TOKEN
  apiBaseUrl: https://api.github.com
  pollIntervalSeconds: 300
  appMentions:
    claude:
      enabled: true
      commentTemplate: "@claude Please review this PR and apply fixes if needed."
    codex:
      enabled: false
      commentTemplate: "@codex please review and patch any remaining issues."

storage:
  dbPath: ~/.night-orch/state.db
  worktreeRoot: ~/.night-orch/worktrees
  logsRoot: ~/.night-orch/logs
  autoCleanup:
    enabled: true
    intervalMinutes: 120
  retention:
    worktreeAgeDays: 7
    detailDays: 30
    archiveDays: 90

notifications:
  channels:
    - type: console
  events:
    onRunStarted: true
    onBlocked: true
    onPrReady: true
    onError: true
    onRetryExhausted: true

loop:
  maxReviewIterations: 3
  maxTotalAgentPasses: 8
  stopOnPlannerFailure: true
  requireVerificationPass: true
  blockOnAmbiguousReview: true
  decompose: true
  maxSubtasks: 5
  maxConcurrentSubtasks: 3

security:
  maxChangedFiles: 50
  maxChangedLines: 5000
  maxDailyCostUsd: 25
  maxCostPerRunUsd: 8

workerProfiles:
  claude:
    type: claude
    command: claude
    args:
      - -p
    workerTimeoutSeconds: 1800
    minimalEnv: true
    env: {}
  codex:
    type: codex
    command: codex
    args:
      - exec
      - --json
    workerTimeoutSeconds: 1800
    minimalEnv: true
    env: {}
  # gemini-acp:
  #   type: acp
  #   command: gemini            # acpx agent name
  #   args: []
  #   workerTimeoutSeconds: 1800

metrics:
  enabled: true
  port: 9100
  host: 0.0.0.0

commentCommands:
  enabled: true
  requireCollaborator: false

mcp:
  enabled: true
  httpPort: 3100

repos:
  - repo: shllg/night-orch
    forge: github
    localPath: ~/src/tools/ai-project-runner
    baseBranch: master
    branchPrefix: orch
    labels:
      ready:
        - orch:ready
      running: orch:running
      blocked:
        - orch:blocked
        - orch:needs-human
      reviewReady: orch:review-ready
      error: orch:error
      retry: orch:retry
    defaults:
      planner: claude
      coder: codex
      reviewer: claude
      doneMode: pr-ready
    selectors:
      includeLabelsAny:
        - orch:ready
      excludeLabelsAny:
        - orch:blocked
        - orch:error
        - orch:needs-human
    environment:
      defaultMode: shared
      bootstrap:
        - command: pnpm install --frozen-lockfile
          when: always
    verify:
      - pnpm typecheck
      - pnpm lint
      - pnpm test
    agents:
      claude: claude
      codex: codex
