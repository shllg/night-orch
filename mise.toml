[tools]
node = "24"

[tasks.dev]
run = """
trap 'night-orch monitoring down; kill 0' EXIT
night-orch monitoring up
echo "Grafana:    http://localhost:3001 (admin/nightorch)"
echo "Prometheus: http://localhost:9091"
echo "MCP SSE:    http://localhost:3100/sse"
night-orch run --config ${NIGHT_ORCH_CONFIG:-config.yaml}
"""
description = "Run night-orch + monitoring stack (Prometheus + Grafana)"

[tasks.dev-solo]
run = "night-orch run --config ${NIGHT_ORCH_CONFIG:-config.yaml}"
description = "Run night-orch without monitoring stack"

[tasks.run-once]
run = "night-orch run-once --config ${NIGHT_ORCH_CONFIG:-config.yaml}"
description = "Single poll cycle"

[tasks.doctor]
run = "night-orch doctor --config ${NIGHT_ORCH_CONFIG:-config.yaml}"
description = "Run doctor checks"

[tasks.labels-init]
run = "night-orch labels-init --config ${NIGHT_ORCH_CONFIG:-config.yaml}"
description = "Create/update orchestration labels in GitHub"

[tasks.poll]
run = "night-orch run-once --config ${NIGHT_ORCH_CONFIG:-config.yaml}"
description = "Manually trigger a single poll cycle"

[tasks.status]
run = "night-orch status --config ${NIGHT_ORCH_CONFIG:-config.yaml}"
description = "Show active runs, recent history, costs"

[tasks.monitoring-up]
run = "night-orch monitoring up"
description = "Start monitoring stack"

[tasks.monitoring-down]
run = "night-orch monitoring down"
description = "Stop monitoring stack"

[tasks.monitoring-logs]
run = "night-orch monitoring logs"
description = "Tail monitoring stack logs"
